<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, user-scalable=no" />
    <title>excavator-web-app</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: #f6f8fd;
      }

      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f8fd;
        color: #006bff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .app-loading-spinner {
        width: 120px;
        height: 120px;
        border: 12px solid rgba(0, 107, 255, 0.14);
        border-top-color: #006bff;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }

      .app-loading-text {
        font-size: 36px;
        font-weight: 500;
        margin-top: 15px;
        line-height: 1;
        color: #5b6370;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DnKDZYjv.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Av29vGxr.css">
    <meta name="version" content="0.0.8">
  </head>
  <body>
    <div id="app-loading" aria-label="Loading">
      <div class="app-loading-box">
        <div class="app-loading-spinner"></div>
        <div class="app-loading-text">Loading...</div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>

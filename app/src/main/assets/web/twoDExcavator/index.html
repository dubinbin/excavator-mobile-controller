<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>2D 挖掘机姿态角度</title>
    <style>
      :root {
        --stage-width: 616;
        --stage-height: 403;
        --diagram-line: rgba(255, 255, 255, 0.9);
        --diagram-fill: #969696;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .viewport {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: transparent;
        /* overflow: hidden; */
      }

      .stage {
        position: absolute;
        left: 10px;
        top: 0;
        transform: translate(var(--stage-left, 0), var(--stage-top, 0))
          scale(var(--stage-scale, 1));
        transform-origin: 0 0;
        isolation: isolate;
      }

      .part {
        position: absolute;
        z-index: 1;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        opacity: 0.72;
        filter: brightness(0.62)
          drop-shadow(0 0 1px rgba(255, 255, 255, 0.95));
        will-change: transform, left, top;
      }

      .base {
        left: 0;
        top: 258px;
        width: 166px;
        height: 84px;
      }

      .measurement-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
        width: 616px;
        height: 403px;
        pointer-events: none;
        transition: opacity 70ms linear;
      }

      .angle-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .debug-panel {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 20;
        display: none;
        gap: 10px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        background: rgba(20, 20, 20, 0.78);
        backdrop-filter: blur(14px);
      }

      .debug-panel.visible {
        display: grid;
      }

      .debug-row {
        display: grid;
        grid-template-columns: 68px 1fr 82px;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-size: 13px;
      }

      .debug-row input {
        width: 100%;
      }

      @media (prefers-reduced-motion: reduce) {
        .part,
        .measurement-layer {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="viewport" aria-label="2D excavator IMU animation">
      <div class="stage" id="stage">
        <canvas
          class="measurement-layer"
          id="measurementLayer"
          width="616"
          height="403"
          aria-hidden="true"
        ></canvas>
        <img class="part base" src="./base.svg" alt="excavator base" />
        <img class="part boom" id="boom" src="./boom.svg" alt="boom" />
        <img class="part stick" id="stick" src="./stick.svg" alt="stick" />
        <img class="part bucket" id="bucket" src="./bucket.svg" alt="bucket" />

        <div class="angle-label boom" id="boomLabel">-70&deg;</div>
        <div class="angle-label stick" id="stickLabel">180&deg;</div>
        <div class="angle-label bucket" id="bucketLabel">60&deg;</div>
      </div>
    </main>

    <section class="debug-panel" id="debugPanel" aria-label="angle debug controls">
      <label class="debug-row">
        <span>大臂</span>
        <input id="boomInput" type="range" min="-90" max="0" step="0.01" />
        <output id="boomOutput"></output>
      </label>
      <label class="debug-row">
        <span>小臂</span>
        <input id="stickInput" type="range" min="0" max="360" step="0.01" />
        <output id="stickOutput"></output>
      </label>
      <label class="debug-row">
        <span>铲斗</span>
        <input id="bucketInput" type="range" min="0" max="180" step="0.01" />
        <output id="bucketOutput"></output>
      </label>
    </section>

    <script>
      (() => {
        const STAGE = { width: 616, height: 403 };

        // These default values reproduce the supplied design frame.
        const DEFAULT_ANGLES = {
          boom: -69.0,
          stick: 96,
          bucket: 120,
        };

        const ANGLE_LIMITS = {
          boom: { min: -90, max: 0 },
          // The stick uses the +/-180 boundary as its center:
          // inward: 180 -> 0, outward: -180 -> 0.
          stick: { min: -180, max: 180, wrapsAt180: true },
          bucket: { min: 0, max: 180 },
        };

        const PARTS = {
          boom: {
            el: document.getElementById("boom"),
            label: document.getElementById("boomLabel"),
            width: 334,
            height: 134,
            pivot: { x: 0, y: 133 },
            end: { x: 334, y: 0 },
            labelOffset: { x: -106, y: -160 },
          },
          stick: {
            el: document.getElementById("stick"),
            label: document.getElementById("stickLabel"),
            width: 54,
            height: 212,
            pivot: { x: 0, y: 33 },
            end: { x: 52, y: 212 },
            labelOffset: { x: 90, y: -90 },
          },
          bucket: {
            el: document.getElementById("bucket"),
            label: document.getElementById("bucketLabel"),
            width: 104,
            height: 96,
            pivot: { x: 84, y: 0 },
            end: { x: 0, y: 90 },
            labelOffset: { x: -132, y: 52 },
          },
        };

        const state = { ...DEFAULT_ANGLES };
        const stageEl = document.getElementById("stage");
        const viewportEl = document.querySelector(".viewport");
        const measurementLayer = document.getElementById("measurementLayer");
        const measurementContext = measurementLayer.getContext("2d");

        function fitStage() {
          const rect = viewportEl.getBoundingClientRect();
          const scale = Math.min(rect.width / STAGE.width, rect.height / STAGE.height);
          const left = (rect.width - STAGE.width * scale) / 2;
          const top = (rect.height - STAGE.height * scale) / 2;

          stageEl.style.setProperty("--stage-scale", scale);
          stageEl.style.setProperty("--stage-left", `${left}px`);
          stageEl.style.setProperty("--stage-top", `${top}px`);
        }

        function rotatePoint(point, pivot, degrees) {
          const radians = (degrees * Math.PI) / 180;
          const cos = Math.cos(radians);
          const sin = Math.sin(radians);
          const dx = point.x - pivot.x;
          const dy = point.y - pivot.y;

          return {
            x: pivot.x + dx * cos - dy * sin,
            y: pivot.y + dx * sin + dy * cos,
          };
        }

        function clamp(value, min, max) {
          return Math.min(Math.max(value, min), max);
        }

        function normalizeStickAngle(value) {
          if (value === 180 || value === -180) return value;

          const normalized = ((((value + 180) % 360) + 360) % 360) - 180;
          return normalized === -180 && value > 0 ? 180 : normalized;
        }

        function sanitizeAngle(key, value) {
          const numericValue = Number(value);
          if (!Number.isFinite(numericValue)) return state[key];

          const limit = ANGLE_LIMITS[key];
          if (limit.wrapsAt180) return normalizeStickAngle(numericValue);
          return clamp(numericValue, limit.min, limit.max);
        }

        function shortestAngleDelta(value, origin) {
          return ((((value - origin + 180) % 360) + 360) % 360) - 180;
        }

        function stickAngleToDebugProgress(angle) {
          if (Math.abs(angle) === 180) return 180;
          if (angle < 0) return Math.abs(angle);
          return 360 - angle;
        }

        function stickDebugProgressToAngle(progress) {
          if (progress === 180) return 180;
          if (progress < 180) return - progress;
          return 360 - progress;
        }

        function placePart(part, pivotGlobal, delta) {
          const left = pivotGlobal.x - part.pivot.x;
          const top = pivotGlobal.y - part.pivot.y;

          part.el.style.left = `${left}px`;
          part.el.style.top = `${top}px`;
          part.el.style.width = `${part.width}px`;
          part.el.style.height = `${part.height}px`;
          part.el.style.transformOrigin = `${part.pivot.x}px ${part.pivot.y}px`;
          part.el.style.transform = `rotate(${delta}deg)`;

          if (!part.end) return null;
          const rotatedEnd = rotatePoint(part.end, part.pivot, delta);
          return {
            x: left + rotatedEnd.x,
            y: top + rotatedEnd.y,
          };
        }

        function formatDegrees(value) {
          const rounded = Math.round(Number(value) * 10) / 10;
          return `${Number.isInteger(rounded) ? rounded.toFixed(0) : rounded.toFixed(1)}°`;
        }

        function getDisplayAngle(key, value) {
          return key === "stick" ? 180 - value : value;
        }

        function placeLabel(label, value) {
          label.textContent = formatDegrees(value);
        }

        function vectorAngle(from, to) {
          return Math.atan2(to.y - from.y, to.x - from.x);
        }

        function pointOnRay(origin, angle, distance) {
          return {
            x: origin.x + Math.cos(angle) * distance,
            y: origin.y + Math.sin(angle) * distance,
          };
        }

        function shortestSweep(startAngle, endAngle) {
          let sweep = endAngle - startAngle;
          while (sweep > Math.PI) sweep -= Math.PI * 2;
          while (sweep < -Math.PI) sweep += Math.PI * 2;
          return sweep;
        }

        function prepareMeasurementLayer() {
          const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          const width = Math.round(STAGE.width * pixelRatio);
          const height = Math.round(STAGE.height * pixelRatio);

          if (
            measurementLayer.width !== width ||
            measurementLayer.height !== height
          ) {
            measurementLayer.width = width;
            measurementLayer.height = height;
          }

          measurementContext.setTransform(
            pixelRatio,
            0,
            0,
            pixelRatio,
            0,
            0
          );
          measurementContext.clearRect(0, 0, STAGE.width, STAGE.height);
          measurementContext.lineCap = "round";
          measurementContext.lineJoin = "round";
        }

        function drawGuideLine(start, end) {
          measurementContext.save();
          measurementContext.beginPath();
          measurementContext.setLineDash([5, 5]);
          measurementContext.lineWidth = 1.25;
          measurementContext.strokeStyle = "rgba(255, 255, 255, 0.88)";
          measurementContext.moveTo(start.x, start.y);
          measurementContext.lineTo(end.x, end.y);
          measurementContext.stroke();
          measurementContext.restore();
        }

        function drawAxis(origin, angle, backward, forward) {
          drawGuideLine(
            pointOnRay(origin, angle, -backward),
            pointOnRay(origin, angle, forward)
          );
        }

        function drawJoint(point) {
          measurementContext.save();
          measurementContext.beginPath();
          measurementContext.arc(point.x, point.y, 3.25, 0, Math.PI * 2);
          measurementContext.fillStyle = "#f3f3f3";
          measurementContext.fill();
          measurementContext.restore();
        }

        function drawMeasurements({
          boomPivot,
          stickPivot,
          bucketPivot,
          bucketTip,
        }) {
          prepareMeasurementLayer();

          const boomAngle = vectorAngle(boomPivot, stickPivot);
          const boomReturnAngle = vectorAngle(stickPivot, boomPivot);
          const stickAngle = vectorAngle(stickPivot, bucketPivot);
          const stickReturnAngle = vectorAngle(bucketPivot, stickPivot);
          const bucketAngle = vectorAngle(bucketPivot, bucketTip);

          // The main-boom sensor uses the vertical datum plane.

        }

        function draw() {
          const boomDelta = -shortestAngleDelta(state.boom, DEFAULT_ANGLES.boom);
          const stickDelta = shortestAngleDelta(state.stick, DEFAULT_ANGLES.stick);
          const bucketDelta = -shortestAngleDelta(
            state.bucket,
            DEFAULT_ANGLES.bucket
          );

          // Parts are positioned in stage (world) coordinates rather than
          // nested DOM elements, so child rotations must explicitly inherit
          // every parent rotation to preserve each joint's relative angle.
          const boomRotation = boomDelta;
          const stickRotation = boomRotation + stickDelta;
          const bucketRotation = stickRotation + bucketDelta;

          const boomPivot = { x: 116, y: 258 };
          const stickPivot = placePart(PARTS.boom, boomPivot, boomRotation);
          const bucketPivot = placePart(PARTS.stick, stickPivot, stickRotation);
          const bucketTip = placePart(
            PARTS.bucket,
            bucketPivot,
            bucketRotation
          );
          placeLabel(PARTS.boom.label, state.boom);
          placeLabel(
            PARTS.stick.label,
            getDisplayAngle("stick", state.stick)
          );
          placeLabel(
            PARTS.bucket.label,
            getDisplayAngle("bucket", state.bucket)
          );
          drawMeasurements({ boomPivot, stickPivot, bucketPivot, bucketTip });
        }

        function readAngle(data, keys, fallback) {
          for (const key of keys) {
            const value = Number(data && data[key]);
            if (Number.isFinite(value)) return sanitizeAngle(fallback.key, value);
          }
          return fallback.value;
        }

        function readComplementaryAngle(data, keys, fallback) {
          for (const key of keys) {
            const value = Number(data && data[key]);
            if (Number.isFinite(value)) {
              return sanitizeAngle(fallback.key, 180 - value);
            }
          }
          return fallback.value;
        }

        function normalizePayload(payload) {
          if (typeof payload === "string") {
            try {
              payload = JSON.parse(payload);
            } catch (error) {
              console.warn("Invalid IMU payload JSON:", error);
              return {};
            }
          }

          if (payload && payload.joints) {
            const joints = payload.joints;

            return {
              boom: joints.boom && joints.boom.z,
              stick: joints.stick && joints.stick.z,
              bucket: joints.bucket && joints.bucket.z,
            };
          }

          if (payload && payload.angles) return payload.angles;
          return payload || {};
        }

        function updateExcavatorAngles(payload) {
          // 这里搞一个小转换
          const changeAllAngle = Object.entries(payload).reduce((prev, cur, index) => {
              prev[cur[0]] = (cur[0] === 'stick' || cur[0] === 'bucket') ? Math.abs(cur[1]) : cur[1]
              return prev;
          }, {});
          const data = normalizePayload(changeAllAngle);

          state.boom = readAngle(
            data,
            ["boom", "boomAngle", "bigArm", "bigArmAngle"],
            { key: "boom", value: state.boom }
          );
          state.stick = readAngle(
            data,
            ["stick", "stickAngle", "smallArm", "smallArmAngle"],
            { key: "stick", value: state.stick }
          );
          state.bucket = readComplementaryAngle(
            data,
            ["bucket", "bucketAngle"],
            { key: "bucket", value: state.bucket }
          );

          draw();
          syncDebugPanel();
        }

        function applyExcavatorPayload(payload) {
          updateExcavatorAngles(payload);
        }

        function syncDebugPanel() {
          for (const key of ["boom", "stick", "bucket"]) {
            const input = document.getElementById(`${key}Input`);
            const output = document.getElementById(`${key}Output`);
            if (!input || !output) continue;

            output.textContent = `${state[key].toFixed(2)}°`;
          }
        }

        function initDebugPanel() {
          if (!new URLSearchParams(window.location.search).has("debug")) return;

          const debugPanel = document.getElementById("debugPanel");
          debugPanel.classList.add("visible");

          for (const key of ["boom", "stick", "bucket"]) {
            const input = document.getElementById(`${key}Input`);
            const output = document.getElementById(`${key}Output`);
            input.addEventListener("input", () => {
              const progressValue = Number(input.value);
              const nextValue =
                key === "stick"
                  ? stickDebugProgressToAngle(progressValue)
                  : progressValue;

              output.textContent = `${nextValue.toFixed(2)}°`;
              updateExcavatorAngles({ [key]: nextValue });
            });
          }

          syncDebugPanel();
        }

        window.updateExcavatorAngles = updateExcavatorAngles;
        window.setExcavatorAngles = updateExcavatorAngles;
        window.onImuData = updateExcavatorAngles;
        window.applyExcavatorPayload = applyExcavatorPayload;
        window.ExcavatorView = {
          updateAngles: updateExcavatorAngles,
          setAngles: updateExcavatorAngles,
          applyPayload: applyExcavatorPayload,
        };

        fitStage();
        draw();
        initDebugPanel();

        window.addEventListener("resize", fitStage);
        if ("ResizeObserver" in window) {
          new ResizeObserver(fitStage).observe(viewportEl);
        }
      })();
    </script>
  </body>
</html>

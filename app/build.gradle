plugins {
    id 'com.android.application'
}

def webProjectDir = rootProject.layout.projectDirectory
        .dir('web/excavator-web-app')
        .asFile
def webDistDir = new File(webProjectDir, 'dist')
def generatedWebAssetsDir = layout.buildDirectory
        .dir('generated/webAssets/bundledWeb')
        .get()
        .asFile
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows')
        ? 'npm.cmd'
        : 'npm'

def installExcavatorWebDependencies = tasks.register(
        'installExcavatorWebDependencies',
        Exec
) {
    group = 'web app'
    description = 'Installs the embedded excavator web app dependencies.'
    workingDir webProjectDir
    commandLine npmCommand, 'ci'
    inputs.files(
            new File(webProjectDir, 'package.json'),
            new File(webProjectDir, 'package-lock.json')
    )
    outputs.file(new File(webProjectDir, 'node_modules/.package-lock.json'))
}

def buildExcavatorWeb = tasks.register('buildExcavatorWeb', Exec) {
    group = 'web app'
    description = 'Builds deterministic web assets without changing package versions.'
    dependsOn installExcavatorWebDependencies
    workingDir webProjectDir
    commandLine npmCommand, 'run', 'build:android'
    inputs.files(fileTree(webProjectDir) {
        exclude '.git/**', '.vscode/**', 'dist/**', 'node_modules/**'
    })
    outputs.dir webDistDir
}

def syncExcavatorWebAssets = tasks.register('syncExcavatorWebAssets', Sync) {
    group = 'web app'
    description = 'Copies the web build into the generated Android assets directory.'
    dependsOn buildExcavatorWeb
    from webDistDir
    into new File(generatedWebAssetsDir, 'web/excavator-web-app')
}

android {
    // AGP 8+ 要求在 build.gradle 中显式声明 namespace，对应 AndroidManifest.xml 的 package
    namespace 'com.capstone.excavator'
    // 升级到较新的 Android SDK（Android 14 / API 34）
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.capstone.excavator'
        minSdk 24
        targetSdk 34
        // versionCode 必须为 ≥1 的正整数（Android / AGP / Play 均不允许 0），发版时递增；
        // 检查更新请求里用 BuildConfig.VERSION_CODE。若业务上需要「第 0 版」语义，用 versionName（如 0.1.0）表达即可。
        versionCode 1
        versionName '1.0'
// https://appassets.androidplatform.net/assets/web/
        // 热更新检查（可按环境改 debug/release 或拆 flavor）
        buildConfigField 'String', 'UPDATE_API_BASE', '"http://192.168.20.145:3000"'
        buildConfigField 'String', 'UPDATE_API_KEY', '"capstone_app_updater_key"'
        buildConfigField 'String', 'UPDATE_CHANNEL', '"prod"'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions += 'webContent'
    productFlavors {
        devWeb {
            dimension 'webContent'
            buildConfigField 'String', 'WEB_APP_BASE_URL', '"http://127.0.0.1:5173/"'
            buildConfigField 'boolean', 'USE_DEV_WEB_SERVER', 'true'
        }
        bundledWeb {
            dimension 'webContent'
            buildConfigField 'String', 'WEB_APP_BASE_URL', '"https://appassets.androidplatform.net/assets/web/excavator-web-app/index.html"'
            buildConfigField 'boolean', 'USE_DEV_WEB_SERVER', 'false'
        }
    }

    sourceSets {
        bundledWeb {
            assets.srcDir generatedWebAssetsDir
        }
    }

    buildTypes {
        // Debug：devWebDebug 连接 Vite；bundledWebDebug 打包 Web 产物。
        debug {
            debuggable true
        }
        // Release：只允许 bundledWebRelease。未配置签名时生成的 APK 无法直接安装。
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // 保持 Java 8 语法级别，JDK 可以使用 11/17 甚至更高
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variantBuilder ->
        if (variantBuilder.productFlavors.any { it.second == 'devWeb' }) {
            variantBuilder.enable = false
        }
    }
}

tasks.configureEach { task ->
    // Every task in a bundled variant may inspect its complete source set (lint model writers do
    // this as well as mergeAssets). Make the generated-assets producer explicit for Gradle's task
    // validation instead of relying on execution order.
    if (task.name.contains('BundledWeb')) {
        task.dependsOn syncExcavatorWebAssets
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.activity:activity:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation files('libs/BlurView-version-3.2.0.aar')
    // RCSDK依赖
    implementation files('libs/rcsdk-v1.8.4.aar')
    
    // FPVPlayer 相关依赖
    implementation files('libs/fpvplayer-v3.3.7.aar')
    implementation files('libs/sky-ijkplayer-v1.1.aar')
    implementation files('libs/isoparser-1.1.9.jar')
    // Kotlin 标准库（FPVWidget 是 Kotlin 类，需要运行时支持）
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
